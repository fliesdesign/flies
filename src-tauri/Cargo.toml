[package]
name = "flies"
version = "0.1.0"
description = "Flies design canvas"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flies_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tempfile = "3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
flate2 = "1.1.10"
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "3.4", features = ["transport-streamable-http-server"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPasteboard",
  "NSBitmapImageRep",
  "NSImageRep",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSData",
  "NSDictionary",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
